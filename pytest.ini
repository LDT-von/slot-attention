[pytest]
testpaths = tests research_models
# The audit symlinks that keep historical receipt paths resolvable make the
# same test module reachable twice (once through the original path, once
# through the archive path).  Collect the archive tree through the ORIGINAL
# path only, so every test identity stays single-valued and the collected
# module name keeps matching the path the receipts name.
norecursedirs = .git third_party evidence local_evidence archive .venv_slot_spe __pycache__ .pytest_cache
